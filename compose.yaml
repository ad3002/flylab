services:
  flylab:
    build:
      context: .
      dockerfile: Dockerfile
    image: flylab:latest
    container_name: flylab-server
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DOMAIN=flylab.aglabx.com
      - DB_PATH=/app/data/flylab.db
      - DATA_DIR=/app/data
      - ARTIFACTS_DIR=/app/artifacts
      # Planner: Claude Code CLI (`claude -p`); see the Dockerfile note about providing it.
      - CLAUDE_BIN=${CLAUDE_BIN:-claude}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-5-5}
      - CLAUDE_TIMEOUT_SECONDS=${CLAUDE_TIMEOUT_SECONDS:-90}
      - LLM_MAX_CONCURRENCY=${LLM_MAX_CONCURRENCY:-2}
      - PARSE_RATE_LIMIT_PER_HOUR=${PARSE_RATE_LIMIT_PER_HOUR:-60}
      - REGISTRATION_OPEN=${REGISTRATION_OPEN:-true}

  reference:
    build:
      context: .
      dockerfile: Dockerfile.reference
    image: flylab-reference:latest
    container_name: flylab-reference-checker
    profiles:
      - reference
    volumes:
      - ./data:/app/data
      - ./reference:/app/reference
      - ./artifacts:/app/artifacts
