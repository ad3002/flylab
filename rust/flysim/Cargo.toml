[package]
name = "flysim"
version = "0.1.0"
edition = "2021"
authors = ["Rodion <diploma@flylab.aglabx.com>", "AI Pair Programmer"]
description = "High-performance spiking neural network simulator for Drosophila connectome"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
bincode = "1.3"
arrow = { version = "53.0", default-features = false }
parquet = { version = "53.0", default-features = false, features = ["arrow", "snap", "flate2", "brotli"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
